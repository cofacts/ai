name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

jobs:
  test-adk:
    name: Test adk (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adk
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs the base branch to find the changed lines.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest -v --cov --cov-report=term --cov-report=xml

      # Report only: shows coverage of the lines this PR changes in the job
      # summary, without failing the job.
      - name: Coverage of changed lines
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        continue-on-error: true
        run: >-
          uvx diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --format "markdown:$RUNNER_TEMP/diff-cover.md"
          && { echo '### adk: coverage of changed lines'; cat "$RUNNER_TEMP/diff-cover.md"; } >> "$GITHUB_STEP_SUMMARY"

  lint-adk:
    name: Lint adk (ruff, ty)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adk
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting (ruff format)
        run: uv run ruff format --check . ../.agents/skills

      # !cancelled(): run every check even when an earlier one fails,
      # so a single CI run reports all format/lint/type errors at once.
      - name: Lint (ruff check)
        if: ${{ !cancelled() }}
        run: uv run ruff check . ../.agents/skills

      - name: Typecheck (ty)
        if: ${{ !cancelled() }}
        run: uv run ty check . ../.agents/skills

  lint-frontend:
    name: Lint frontend (ESLint, Prettier, tsc, tokens, Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs the base branch to find the changed lines.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm run lint

      # !cancelled(): run every check even when an earlier one fails,
      # so a single CI run reports all format/lint/type errors at once.
      - name: Format check (Prettier)
        if: ${{ !cancelled() }}
        run: pnpm exec prettier --check .

      - name: Type check (TypeScript)
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit

      - name: Design tokens up to date
        if: ${{ !cancelled() }}
        run: pnpm run tokens:check

      - name: Unit tests (Vitest)
        if: ${{ !cancelled() }}
        run: pnpm test --coverage

      # Report only: shows coverage of the lines this PR changes in the job
      # summary, without failing the job.
      - name: Coverage of changed lines
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        continue-on-error: true
        run: >-
          pipx run diff-cover coverage/cobertura-coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --format "markdown:$RUNNER_TEMP/diff-cover.md"
          && { echo '### Frontend: coverage of changed lines'; cat "$RUNNER_TEMP/diff-cover.md"; } >> "$GITHUB_STEP_SUMMARY"
