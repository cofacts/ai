apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cofacts-ai
  labels:
    cloud.googleapis.com/location: asia-east1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        # url-resolver is deliberately absent here. The client is written to
        # survive an unreachable resolver — every URL buckets as
        # RESOLVER_UNAVAILABLE ("no signal") and the verifier falls back to
        # `url_context` — and that fallback is only worth having if the
        # deployment lets it happen. Listing url-resolver would also force it to
        # carry a startup probe, which is the thing that would actually gate the
        # revision; see the comment where that probe used to be, on the
        # url-resolver container below.
        run.googleapis.com/container-dependencies: '{"ingress":["backend"],"backend":["cloudsql-proxy"]}'
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      # Request timeout for the Cloud Run revision. Without this, Cloud Run
      # applies its 300s default, which cuts long multimodal writer↔verifier↔
      # investigator loops mid-run with no final answer (see #84). 900s (15 min)
      # gives ambiguous VIDEO/AUDIO adjudications room to converge.
      timeoutSeconds: 900
      serviceAccountName: ${SERVICE_ACCOUNT_EMAIL}
      containers:
      - name: ingress
        image: ${FRONTEND_IMAGE}
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        ports:
        - containerPort: 3000
        env:
        - name: ADK_URL
          value: "http://localhost:8000"
        - name: COFACTS_API_URL
          value: "${COFACTS_API_URL}"
        - name: LANGFUSE_PUBLIC_KEY
          value: "${LANGFUSE_PUBLIC_KEY}"
        - name: LANGFUSE_SECRET_KEY
          value: "${LANGFUSE_SECRET_KEY}"
        - name: LANGFUSE_BASE_URL
          value: "https://langfuse.cofacts.tw"
        - name: LANGFUSE_TRACING_ENVIRONMENT
          value: "${LANGFUSE_TRACING_ENVIRONMENT}"
      - name: backend
        image: ${BACKEND_IMAGE}
        resources:
          limits:
            cpu: "1000m"
            memory: "2048Mi"
        env:
        - name: PORT
          value: "8000"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "true"
        - name: GOOGLE_CLOUD_PROJECT
          value: "${GC_PROJECT_ID}"
        - name: GOOGLE_CLOUD_LOCATION
          value: "global"
        - name: LANGFUSE_PUBLIC_KEY
          value: "${LANGFUSE_PUBLIC_KEY}"
        - name: LANGFUSE_SECRET_KEY
          value: "${LANGFUSE_SECRET_KEY}"
        - name: LANGFUSE_BASE_URL
          value: "https://langfuse.cofacts.tw"
        - name: LANGFUSE_TRACING_ENVIRONMENT
          value: "${LANGFUSE_TRACING_ENVIRONMENT}"
        - name: DATABASE_URL
          value: "${DATABASE_URL}"
        # Persist artifacts (e.g. Google Search suggestion widgets) to GCS so
        # they survive across revisions/instances, alongside the Postgres
        # session store above.
        - name: GCS_ARTIFACT_BUCKET
          value: "${GCS_ARTIFACT_BUCKET}"
        - name: COFACTS_API_URL
          value: "${COFACTS_API_URL}"
        # url-resolver runs as a sidecar in this same instance (see below), so
        # the verifier's page pre-fetch talks to it over localhost instead of
        # the docker-compose service name the client defaults to.
        - name: URL_RESOLVER_ADDRESS
          value: "localhost:4000"
        # Deadline for the WHOLE ResolveUrl stream, not per URL: the client
        # passes it straight to the streaming RPC, and any URL still
        # unanswered when the stream ends comes back TIMEOUT — which it treats
        # as "no signal" and degrades past, invisibly. The client's own default
        # is 30s, which does not clear the arithmetic here: up to 20 URLs
        # (URL_RESOLVER_MAX_URLS) at SCRAPE_MAX_CONCURRENCY 3 is ~7 waves, and
        # each wave is a round trip to a remote Cloudflare browser rather than
        # an in-process chromium. Set explicitly so the budget is a
        # deploy-visible decision: ~7 waves at ~10s each, plus headroom, and
        # still far inside the revision's 900s timeout. This blocks the
        # verifier's model call, so it caps user-visible latency too.
        - name: URL_RESOLVER_TIMEOUT
          value: "120"
        startupProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
      - name: cloudsql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
        args:
          - "--structured-logs"
          - "--port=5432"
          - "--address=0.0.0.0"
          - "--auto-iam-authn"
          - "${GC_PROJECT_ID}:asia-east1:cofacts"
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
        startupProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 2
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      # Headless-browser page fetcher behind the verifier's URL pre-fetch. It
      # speaks insecure gRPC with no auth, so it is never exposed as its own
      # service: as a sidecar it is reachable only over this instance's
      # localhost, the same containment the docker-compose deployment gets from
      # its private network (rumors-deploy `docker-compose.sample.yml`).
      - name: url-resolver
        # Public Docker Hub image, published by cofacts/url-resolver on release
        # tags (`:latest`) and master pushes (`:dev`). Cloud Run caches public
        # Docker Hub images for up to an hour, so a freshly pushed `:latest` can
        # take that long to appear in a new revision.
        image: docker.io/cofacts/url-resolver:latest
        resources:
          limits:
            # Sized for the Cloudflare backend below, where no chromium ever
            # starts in this container: measured idle footprint is ~45 MiB (0
            # browser processes), against ~150 MiB and a full browser process
            # tree on the local backend. What remains here is the gRPC server
            # plus Readability.js over page text arriving from the remote
            # browser — up to SCRAPE_MAX_CONCURRENCY (default 3) pages at once,
            # and a CDP message can now carry up to 32 MiB.
            #
            # 512Mi is therefore ~10x the idle footprint, not a trim to it.
            # Cloud Run terminates the *whole instance* when any single
            # container exceeds its memory limit, which on a 900 s request
            # timeout means killing an agent turn in flight — so the headroom is
            # deliberate. If it ever OOMs, lower SCRAPE_MAX_CONCURRENCY before
            # raising this.
            #
            # These numbers only hold while BROWSER_BACKEND is `cloudflare`.
            # Reverting to a local chromium here without restoring 1 vCPU /
            # 2048Mi would OOM the instance.
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: PORT
          value: "4000"
        # Where puppeteer's browser runs. Pinned to Cloudflare Browser Rendering
        # rather than selectable: the container above is sized for it, and a
        # deploy-time switch back to a local chromium would OOM the instance
        # rather than fall back gracefully. Reverting is a code change — this
        # line and the resource limits together — which is the point. Local
        # chromium remains url-resolver's default everywhere else, including
        # docker-compose for local dev.
        - name: BROWSER_BACKEND
          value: "cloudflare"
        # Required, not optional: with the backend pinned above, an empty value
        # here fails every resolve. The deploy workflow refuses to render this
        # file when either is unset. The token needs the account-level
        # "Browser Rendering: Edit" scope and nothing else.
        - name: CLOUDFLARE_ACCOUNT_ID
          value: "${CLOUDFLARE_ACCOUNT_ID}"
        - name: CLOUDFLARE_API_TOKEN
          value: "${CLOUDFLARE_API_TOKEN}"
        # Idle window before Cloudflare closes the remote session. Unset renders
        # as "" and url-resolver falls back to its own 60000 ms default. The
        # session is billed until it times out, so this trades session reuse
        # against a billed idle tail; set the CLOUDFLARE_KEEP_ALIVE_MS repo
        # variable to tune it (Cloudflare caps it at 600000).
        - name: CLOUDFLARE_KEEP_ALIVE_MS
          value: "${CLOUDFLARE_KEEP_ALIVE_MS}"
        # No startupProbe, deliberately — this is what actually keeps a broken
        # sidecar from taking the service down. Cloud Run requires that "all
        # containers within the instance need to be healthy" for an instance to
        # serve, so a startup probe here would gate the whole revision's
        # readiness, not just this container. Dropping `url-resolver` from
        # container-dependencies above is not sufficient on its own: the probe
        # is the operative gate, and the dependency was only what made the probe
        # mandatory ("Dependent container must have startup probe specified").
        #
        # Nothing is given up by removing it. The probe could only be tcpSocket,
        # and the gRPC server binds before any browser is contacted, so passing
        # it proved the port was open and never that a page could be rendered —
        # while failing it took the whole service down over a dependency the
        # client is explicitly written to survive.
        #
        # This does not make the sidecar wholly unable to affect the instance: a
        # container that *exits* still terminates it. What it removes is the
        # failure-to-bind case, which is the one a mutable `:latest` tag makes
        # reachable with no deploy on this side to correlate it against.
  ${TRAFFIC_BLOCK}
