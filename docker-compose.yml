services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - ADK_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./adk
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - ./adk/cofacts_ai/.env
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - LANGFUSE_BASE_URL=https://langfuse.cofacts.tw
      - LANGFUSE_TRACING_ENVIRONMENT=local
    depends_on:
      - redis
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Background runs (adk/cofacts_ai/run_bus.py). Production uses the redis
  # container rumors-line-bot already runs on the same docker network.
  redis:
    image: redis:alpine
