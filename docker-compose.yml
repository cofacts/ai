services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - ADK_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  backend:
    build:
      context: ./adk
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - ./adk/cofacts_ai/.env
    environment:
      - PORT=8000
      - LANGFUSE_BASE_URL=https://langfuse.cofacts.tw
      - LANGFUSE_TRACING_ENVIRONMENT=local
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Background runs (src/server/runBus.server.ts, in the BFF). Production uses
  # the redis container rumors-line-bot already runs on the same network.
  redis:
    image: redis:alpine
